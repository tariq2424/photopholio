{% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy">{% else %}{% with cover=p.cover %}{% if cover %}<img src="{{ cover.image.url }}" alt="{{ cover.caption|truncatechars:60 }}" loading="lazy">{% else %}<span class="tile-fallback">{{ p.initials }}</span>{% endif %}{% endwith %}{% endif %}
