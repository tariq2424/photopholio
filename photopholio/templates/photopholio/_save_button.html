{# Detail page: a labelled save button. Needs p, is_saved. #}
{% if user.is_authenticated %}
<form method="post" action="{% url 'favourite_toggle' p.slug %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-outline-dark btn-sm" aria-pressed="{% if is_saved %}true{% else %}false{% endif %}"><i class="bi {% if is_saved %}bi-heart-fill text-danger{% else %}bi-heart{% endif %}"></i> {% if is_saved %}Saved{% else %}Save{% endif %}</button>
</form>
{% else %}
<a class="btn btn-outline-dark btn-sm" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}"><i class="bi bi-heart"></i> Save</a>
{% endif %}
