{% extends 'photopholio/base.html' %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="container section text-center" style="max-width:560px">
  <h1 style="font-size:clamp(2.2rem,5vw,3rem)">Check your email</h1>
  <p class="muted mt-3">If an account uses that email, a reset link is on its way. It can take a minute, and it may land in spam.</p>
  <a class="btn btn-primary" href="{% url 'login' %}">Back to log in</a>
</div>
{% endblock %}
